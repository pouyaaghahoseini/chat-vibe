version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: chatvibe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: chatvibe-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: chatvibe-backend
    environment:
      APP_ENV: ${APP_ENV}
      BACKEND_PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MAX_SUBSCRIBERS_PER_CHANNEL: ${MAX_SUBSCRIBERS_PER_CHANNEL}
      AI_SUMMARY_WINDOW_SECONDS: ${AI_SUMMARY_WINDOW_SECONDS}
      CHANNEL_IDLE_SHUTDOWN_SECONDS: ${CHANNEL_IDLE_SHUTDOWN_SECONDS}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: chatvibe-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: